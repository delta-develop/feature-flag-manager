services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes:
      - flags-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  flags-data:
